<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ChatGPTから登録した学習項目を確認するStudy Karte" />
    <title>Study Karte</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">STUDY KARTE</p>
        <h1>学習項目</h1>
        <p class="subtitle">ChatGPTで出会った知識を、ここで育てる。</p>
      </div>
      <div id="user-menu" class="user-menu" hidden>
        <img id="user-photo" alt="" hidden />
        <span id="user-name"></span>
        <button id="sign-out-button" class="text-button" type="button">ログアウト</button>
      </div>
    </header>

    <main>
      <section id="login-panel" class="panel login-panel" aria-labelledby="login-title">
        <div>
          <p class="eyebrow">YOUR LEARNING, IN ONE PLACE</p>
          <h2 id="login-title">学びの続きを始めよう</h2>
          <p>Googleでログインすると、ChatGPTから登録した学習項目を安全に確認できます。</p>
        </div>
        <button id="google-sign-in-button" class="google-button" type="button">
          <span class="google-mark" aria-hidden="true">G</span>
          Googleで続ける
        </button>
        <p id="login-status" class="login-status" role="status" aria-live="polite"></p>
      </section>

      <section id="items-panel" class="items-panel" hidden>
        <div class="toolbar panel">
          <label>
            <span>言語</span>
            <select id="language-filter">
              <option value="">すべて</option>
            </select>
          </label>
          <label>
            <span>種類</span>
            <select id="type-filter">
              <option value="">すべて</option>
              <option value="vocabulary">単語</option>
              <option value="phrase">フレーズ</option>
              <option value="grammar">文法</option>
            </select>
          </label>
          <button id="refresh-button" class="secondary-button" type="button">更新</button>
        </div>

        <details class="import-panel panel">
          <summary>以前のデータをインポート</summary>
          <div class="import-content">
            <p>Study Karteから書き出したJSONバックアップを選択してください。</p>
            <input id="import-file" type="file" accept="application/json,.json" />
            <p id="import-summary" class="import-summary" role="status" aria-live="polite"></p>
            <button id="import-button" class="primary-button" type="button" disabled>インポートする</button>
          </div>
        </details>

        <div class="result-heading">
          <p id="result-count" aria-live="polite"></p>
          <p class="hint">最近登録した順</p>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="item-list" class="item-list"></div>
      </section>
    </main>

    <template id="item-template">
      <article class="item-card">
        <div class="item-topline">
          <span class="type-badge"></span>
          <time class="created-at"></time>
        </div>
        <h2 class="surface"></h2>
        <p class="reading"></p>
        <p class="meaning"></p>
        <p class="note"></p>
        <div class="mastery-row">
          <span>習熟度</span>
          <div class="mastery-track"><span class="mastery-bar"></span></div>
          <strong class="mastery-value"></strong>
        </div>
      </article>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
