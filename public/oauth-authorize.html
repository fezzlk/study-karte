<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Study Karteに接続</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="oauth-page">
      <section class="panel login-panel">
        <div>
          <p class="eyebrow">STUDY KARTE</p>
          <h1>ChatGPTと接続</h1>
          <p>Googleでログインし、あなたのカルテへのアクセスを許可します。</p>
        </div>
        <button id="oauth-sign-in" class="google-button" type="button">
          <span class="google-mark" aria-hidden="true">G</span>Googleで続ける
        </button>
        <p id="oauth-status" class="login-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="/oauth.js"></script>
  </body>
</html>
